[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gippo-bot"
version = "0.4.0"
description = "Telegram bot for checking a GIPPO loyalty cabinet"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kabaye" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "python-telegram-bot>=22.6,<23",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
gippo-bot = "gippo_bot.bot:main"
gippo-check = "gippo_bot.cli:main"
gippo-cache-refresh = "gippo_bot.refresh:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gippo_bot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
